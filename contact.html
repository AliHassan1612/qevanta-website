<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — Qevanta</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="nav">
<a class="brand" href="index.html"><div class="logo">Q</div><div><strong>Qevanta</strong><small>Audience Intelligence</small></div></a>
<nav class="navlinks"><a href="index.html#features">Features</a><a href="index.html#pricing">Pricing</a><a href="affiliate.html">Affiliates</a></nav>
<a class="cta" href="index.html#pricing">Start Free</a>
</header>

<main class="section wrap">
<div class="value-card" style="max-width:900px;margin:auto">
<h1 style="font-size:46px;margin-top:0">Contact Qevanta</h1>
<p>Need help with your account, billing, referrals, or the extension? Send us a message and we'll get back to you within 24 hours.</p>

<iframe name="qevantaHiddenFrame" style="display:none;"></iframe>

<form id="qevantaContactForm" action="https://formspree.io/f/xykqwrzy" method="POST" target="qevantaHiddenFrame" onsubmit="return showQevantaSuccess();">
<label>Your Name</label>
<input id="contactName" type="text" name="name" required style="width:100%;padding:14px;margin:8px 0 20px;">

<label>Email Address</label>
<input id="contactEmail" type="email" name="email" required style="width:100%;padding:14px;margin:8px 0 20px;">

<label>Message</label>
<textarea id="contactMessage" name="message" rows="6" required style="width:100%;padding:14px;margin:8px 0 20px;"></textarea>

<button id="contactSubmitBtn" class="cta" type="submit">Send Message</button>
<p id="formMsg" style="margin-top:16px;color:#9ee7bd"></p>
</form>

<br><br>
<p>or email us directly at <b>inquiries.qevanta@gmail.com</b></p>
</div>
</main>

<script>
const QEVANTA_SUPABASE_URL = "https://mfgmkvmawhfdsigawrpn.supabase.co";
const QEVANTA_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mZ21rdm1hd2hmZHNpZ2F3cnBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5Mjk5NjYsImV4cCI6MjA5NzUwNTk2Nn0.6znoxf1v7SDdvBvjMwgdDTjQt7dpsI2qbmvVI1BPN5c";
const qevantaDb = window.supabase.createClient(QEVANTA_SUPABASE_URL, QEVANTA_SUPABASE_ANON_KEY);

function showQevantaSuccess(){
  const form = document.getElementById("qevantaContactForm");
  const msg = document.getElementById("formMsg");
  const btn = document.getElementById("contactSubmitBtn");

  msg.textContent = "Sending...";
  btn.textContent = "Sending...";
  btn.disabled = true;

  const name = document.getElementById("contactName").value.trim();
  const email = document.getElementById("contactEmail").value.trim();
  const message = document.getElementById("contactMessage").value.trim();

  qevantaDb.rpc("qevanta_save_contact_message", {
    p_type: "contact",
    p_name: name,
    p_email: email,
    p_profile: null,
    p_audience_size: null,
    p_promotion_method: null,
    p_message: message
  });

  setTimeout(function(){
    form.reset();
    msg.textContent = "Message sent successfully. We'll get back to you soon.";
    btn.textContent = "Send Message";
    btn.disabled = false;
  }, 1600);

  return true;
}
</script>
</body>
</html>
