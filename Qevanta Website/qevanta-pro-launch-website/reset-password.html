<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password - Qevanta</title><link rel="stylesheet" href="style.css"></head><body><main class="section wrap"><div class="card" style="max-width:560px;margin:60px auto"><div class="logo">Q</div><h1 style="font-size:44px;letter-spacing:-1px">Reset Password</h1><p class="sub">Enter your new password below. Then return to the Qevanta extension and login again.</p><input id="newPassword" type="password" placeholder="New password"><br><br><button class="btn" id="updateBtn">Update Password</button><p id="msg" class="status"></p></div></main><script>const SUPABASE_URL="https://mfgmkvmawhfdsigawrpn.supabase.co";const SUPABASE_ANON_KEY="PASTE_SUPABASE_ANON_KEY_HERE";document.getElementById('updateBtn').onclick=async()=>{const password=document.getElementById('newPassword').value.trim();const msg=document.getElementById('msg');if(password.length<8){msg.textContent='Password must be at least 8 characters.';return}const hash=new URLSearchParams(location.hash.substring(1));const accessToken=hash.get('access_token');if(!accessToken){msg.textContent='Invalid or expired reset link.';return}msg.textContent='Updating password...';const res=await fetch(`${SUPABASE_URL}/auth/v1/user`,{method:'PUT',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${accessToken}`},body:JSON.stringify({password})});msg.textContent=res.ok?'Password updated successfully. You can now login in Qevanta extension.':'Could not update password. Please request a new reset link.'};</script></body></html>
