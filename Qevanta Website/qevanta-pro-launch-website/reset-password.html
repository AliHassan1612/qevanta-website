<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password - Qevanta</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Inter,Arial,sans-serif;
      background:radial-gradient(circle at top left,#26145c,#07111f 45%,#021018);
      color:#fff;
    }
    .card{
      width:min(440px,92%);
      padding:38px;
      border-radius:28px;
      background:rgba(15,23,42,.88);
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 30px 90px rgba(0,0,0,.45);
      text-align:center;
    }
    .logo{
      width:64px;
      height:64px;
      margin:0 auto 18px;
      border-radius:18px;
      display:grid;
      place-items:center;
      font-weight:900;
      font-size:30px;
      background:linear-gradient(135deg,#7c3aed,#06b6d4);
    }
    h1{margin:0 0 10px;font-size:32px}
    p{color:#b8c2d8;line-height:1.6}
    input{
      width:100%;
      box-sizing:border-box;
      margin:18px 0 12px;
      padding:16px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background:#1e293b;
      color:#fff;
      font-size:16px;
      outline:none;
    }
    button{
      width:100%;
      padding:16px;
      border:0;
      border-radius:14px;
      color:white;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      background:linear-gradient(90deg,#7c3aed,#06b6d4);
    }
    #msg{margin-top:16px;font-size:14px}
    .success{color:#22c55e}
    .error{color:#fb7185}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Q</div>
    <h1>Reset Password</h1>
    <p>Create a new password for your Qevanta account. After updating, return to the extension and login again.</p>

    <input id="newPassword" type="password" placeholder="New password">
    <button id="updateBtn">Update Password</button>
    <p id="msg"></p>
  </div>

<script>
const SUPABASE_URL = "https://mfgmkvmawhfdsigawrpn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mZ21rdm1hd2hmZHNpZ2F3cnBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5Mjk5NjYsImV4cCI6MjA5NzUwNTk2Nn0.6znoxf1v7SDdvBvjMwgdDTjQt7dpsI2qbmvVI1BPN5c
";

document.getElementById("updateBtn").onclick = async () => {
  const password = document.getElementById("newPassword").value.trim();
  const msg = document.getElementById("msg");

  msg.className = "";

  if(password.length < 8){
    msg.textContent = "Password must be at least 8 characters.";
    msg.className = "error";
    return;
  }

  const hash = new URLSearchParams(window.location.hash.substring(1));
  const accessToken = hash.get("access_token");

  if(!accessToken){
    msg.textContent = "Invalid or expired reset link. Please request a new reset email from the Qevanta extension.";
    msg.className = "error";
    return;
  }

  msg.textContent = "Updating password...";

  const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${accessToken}`
    },
    body: JSON.stringify({ password })
  });

  if(!res.ok){
    msg.textContent = "Could not update password. Please request a new reset link.";
    msg.className = "error";
    return;
  }

  msg.textContent = "Password updated successfully. You can now return to the Qevanta extension and login.";
  msg.className = "success";
};
</script>
</body>
</html>
