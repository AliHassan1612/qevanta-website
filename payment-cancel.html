<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Cancelled — Qevanta</title>
<link rel="icon" href="favicon.png">
<style>
:root{--text:#f8fbff;--muted:#a7b4c9;--line:rgba(255,255,255,.12);--purple:#7c3cff;--blue:#14bff0;--red:#ff8a8a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 30% 0%,rgba(124,60,255,.35),transparent 35%),linear-gradient(180deg,#030714,#050b18);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
.card{width:min(560px,100%);border:1px solid var(--line);border-radius:28px;padding:34px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));box-shadow:0 30px 90px rgba(0,0,0,.38);text-align:center}
.icon{width:74px;height:74px;border-radius:22px;display:grid;place-items:center;margin:0 auto 20px;background:rgba(255,138,138,.13);color:var(--red);font-size:38px}
h1{margin:0 0 10px;font-size:36px}
p{color:var(--muted);line-height:1.7}
.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:16px;padding:15px 22px;border-radius:14px;background:linear-gradient(135deg,var(--purple),var(--blue));color:white;text-decoration:none;font-weight:900}
.secondary{background:rgba(255,255,255,.06);border:1px solid var(--line);margin-left:8px}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">!</div>
    <h1>Payment Cancelled</h1>
    <p>No payment was completed and your plan was not changed. You can return to pricing whenever you are ready.</p>
    <a class="btn" href="index.html#pricing">Back to Pricing</a>
    <a class="btn secondary" href="index.html">Home</a>
  </div>
</body>
</html>
