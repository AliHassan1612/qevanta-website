<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Confirmed - Qevanta</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Inter,Arial,sans-serif;
      background:radial-gradient(circle at top left,#26145c,#07111f 45%,#021018);
      color:#fff;
    }
    .card{
      width:min(440px,92%);
      padding:38px;
      border-radius:28px;
      background:rgba(16,21,34,.92);
      border:1px solid rgba(255,255,255,.12);
      text-align:center;
      box-shadow:0 30px 90px rgba(0,0,0,.35);
    }
    .mark{
      width:64px;
      height:64px;
      margin:0 auto 18px;
      border-radius:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:30px;
      font-weight:900;
      background:linear-gradient(135deg,#7c3aed,#06b6d4);
    }
    h1{margin:0 0 10px;font-size:28px}
    p{color:#aeb9cc;line-height:1.55}
    a{
      display:inline-block;
      margin-top:18px;
      padding:12px 18px;
      border-radius:14px;
      color:#fff;
      text-decoration:none;
      font-weight:800;
      background:linear-gradient(135deg,#7c3aed,#06b6d4);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">Q</div>
    <h1>Email Confirmed</h1>
    <p>Your Qevanta email has been verified successfully. You can now return to the extension and log in.</p>
    <a href="https://alihassan1612.github.io/qevanta-website/">Continue</a>
  </div>
</body>
</html>
