<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reset Password - Qevanta</title>
</head>
<body>
  <h2>Reset Your Password</h2>

  <input id="newPassword" type="password" placeholder="New password">
  <button id="resetBtn">Update Password</button>
  <p id="msg"></p>

  <script>
    const SUPABASE_URL = "https://mfgmkvmawhfdsigawrpn.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY_HERE";

    document.getElementById("resetBtn").onclick = async () => {
      const password = document.getElementById("newPassword").value.trim();
      const msg = document.getElementById("msg");

      if(password.length < 8){
        msg.textContent = "Password must be at least 8 characters.";
        return;
      }

      const hash = new URLSearchParams(window.location.hash.substring(1));
      const accessToken = hash.get("access_token");

      if(!accessToken){
        msg.textContent = "Reset link is invalid or expired.";
        return;
      }

      msg.textContent = "Updating password...";

      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "apikey": eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mZ21rdm1hd2hmZHNpZ2F3cnBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5Mjk5NjYsImV4cCI6MjA5NzUwNTk2Nn0.6znoxf1v7SDdvBvjMwgdDTjQt7dpsI2qbmvVI1BPN5c
,
          "Authorization": `Bearer ${accessToken}`
        },
        body: JSON.stringify({ password })
      });

      if(!res.ok){
        msg.textContent = "Could not update password. Please request a new reset link.";
        return;
      }

      msg.textContent = "Password updated successfully. You can now login in the Qevanta extension.";
    };
  </script>
</body>
</html>
