<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affiliate Login — Qevanta</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#030714,#050b18);color:#f8fbff;font-family:Inter,Arial,sans-serif;padding:24px}
.card{width:min(430px,100%);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:30px;background:rgba(255,255,255,.06)}
.logo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3cff,#14bff0);font-size:28px;font-weight:900;margin-bottom:18px}
input,button{width:100%;padding:15px 16px;border-radius:14px;margin-top:12px;box-sizing:border-box}
input{border:1px solid rgba(255,255,255,.12);background:#111827;color:white}
button{border:0;background:linear-gradient(135deg,#7c3cff,#14bff0);color:white;font-weight:900;cursor:pointer}
p,small{color:#a7b4c9;line-height:1.6}
.err{color:#ff8a8a}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Q</div>
  <h1>Affiliate Login</h1>
  <p>Login to view your Qevanta referral code, commissions, referrals, and withdrawals.</p>

  <input id="email" type="email" placeholder="Email address">
  <input id="password" type="password" placeholder="Password">

  <button id="loginBtn">Login</button>
  <small id="msg"></small>
</div>

<script>
const SUPABASE_URL = "https://mfgmkvmawhfdsigawrpn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mZ21rdm1hd2hmZHNpZ2F3cnBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5Mjk5NjYsImV4cCI6MjA5NzUwNTk2Nn0.6znoxf1v7SDdvBvjMwgdDTjQt7dpsI2qbmvVI1BPN5c";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.getElementById("loginBtn").addEventListener("click", async ()=>{
  const msg = document.getElementById("msg");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    msg.className = "err";
    msg.textContent = "Enter email and password.";
    return;
  }

  msg.className = "";
  msg.textContent = "Logging in...";

  const { error } = await db.auth.signInWithPassword({ email, password });

  if(error){
    msg.className = "err";
    msg.textContent = error.message || "Login failed.";
    return;
  }

  location.href = "affiliate-dashboard.html";
});
</script>
</body>
</html>
